server.port=8080
server.forward-headers-strategy=framework

spring.application.name=forexbot-api

# Database — values from backend/.env.example (override with DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://84.8.131.140:5432/forex2?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:joelchipoya}
spring.datasource.password=${DB_PASSWORD:Kalimbwejoel}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=15000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# E-mail — values from backend/.env.example (override with MAIL_*)
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.resend.com}
spring.mail.properties.mail.debug=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Mail SMTP must not mark the whole app DOWN — that keeps Docker/Dokploy on "starting".
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
