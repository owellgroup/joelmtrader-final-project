# Dokploy → Compose Type: Docker Compose
# Compose Path: ./docker-compose.yml
#
# Backend only: engine + api
# (Flutter web is NOT deployed here — run it locally or host it elsewhere.)
#
# Rules for Dokploy:
# - Do NOT set container_name
# - Service names stay: api, engine

services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-2026-10-27-jpy-fix}
    restart: unless-stopped
    environment:
      BROKER_MODE: ${BROKER_MODE:-mt5}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-a293bc338ba95dbd8bcfb55aa4ab99a13f51351f712d034c}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-f262fe05a3c754a7aa5f5457ad3b4f5fabfe9487fb2b4adc}
      JAVA_EVENTS_URL: http://api:8080/internal/events
      MT5_RPYC_HOST: ${MT5_RPYC_HOST:-}
      MT5_RPYC_PORT: ${MT5_RPYC_PORT:-18812}
      MAGIC_NUMBER: ${MAGIC_NUMBER:-26101801}
      SYMBOL_SUFFIX: ${SYMBOL_SUFFIX:-}
      PAPER_BALANCE: ${PAPER_BALANCE:-12}
      PAPER_SPEED: ${PAPER_SPEED:-1}
      DATA_DIR: /data
    volumes:
      - engine-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-2026-10-27-jpy-fix}
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://84.8.131.140:5432/forex2?prepareThreshold=0}
      DB_USERNAME: ${DB_USERNAME:-joelchipoya}
      DB_PASSWORD: ${DB_PASSWORD:-Kalimbwejoel}
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-re_RgSXUkdm_J3rvXQt3cEgUXWUyps6UnpHg}
      MAIL_FROM: ${MAIL_FROM:-hello@notifications.wayaspot.com}
      REPORT_TO: ${REPORT_TO:-joel@wayaspot.com}
      LOGO_URL: ${LOGO_URL:-https://res.cloudinary.com/dixvk0sop/image/upload/v1792407456/jpXfinance_jxty7v.png}
      BRAND_NAME: ${BRAND_NAME:-WayaSpot FX Bot}
      DAILY_REPORT_CRON: ${DAILY_REPORT_CRON:-0 55 23 * * *}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-joel@wayaspot.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Kalimbwejoel@01}
      JWT_SECRET: ${JWT_SECRET:-7s0xyoaSf4TmGLPnNvGURehz75OnBsMez33ETrFrlLh}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS:-365}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-704d862a43b153f79853acdd6856d6d8a2e1b902dfc37f49}
      ENGINE_API_KEY: ${ENGINE_API_KEY:-a293bc338ba95dbd8bcfb55aa4ab99a13f51351f712d034c}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-f262fe05a3c754a7aa5f5457ad3b4f5fabfe9487fb2b4adc}
      ENGINE_URL: ${ENGINE_URL_OVERRIDE:-http://engine:8000}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - engine
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  engine-data:
