# Thin public gateway — not the Flutter app.
# Flutter (web / Android / desktop) → http://SERVER:8088/api/...
# MT5 bridge → ws://SERVER:8088/mt5-bridge

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location /mt5-bridge {
        proxy_pass http://engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
    }

    location /actuator/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /internal/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Key $http_x_internal_key;
    }

    location = /health {
        proxy_pass http://api:8080/actuator/health/liveness;
    }

    location / {
        default_type application/json;
        return 200 '{"ok":true,"service":"joeltrader-gateway","api":"/api","hint":"Point Flutter API_URL to this host (port 8088)."}';
    }
}
